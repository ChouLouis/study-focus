<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Room｜我的讀書小基地</title>
<style>
:root{--ink:#213c35;--muted:#687b74;--green:#30694f;--paper:#f6f5ee;--line:#dde3d8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#e9eee5;color:var(--ink);font-weight:650}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c89639;outline-offset:3px}header{max-width:1120px;margin:auto;padding:30px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:800}.mark{background:var(--green);color:white;padding:7px 11px;border-radius:11px;margin-right:10px}.tag{font-size:12px;letter-spacing:2px;color:var(--muted)}main{max-width:1120px;margin:0 auto;padding:44px 24px}h1{font-size:clamp(29px,4vw,43px);margin:10px 0 12px;letter-spacing:-1px}.intro{color:var(--muted);line-height:1.8;margin:0 0 30px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--green);font-weight:700}.layout{display:grid;grid-template-columns:1.18fr 1fr;gap:24px}.card{border:1px solid var(--line);border-radius:24px;background:#fff;padding:28px}.cardhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h2{font-size:20px;margin:0}.sub{font-size:13px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px}.stat{border:1px solid var(--line);border-radius:16px;padding:18px;background:#ffffff90}.stat strong{display:block;font-size:28px;margin-bottom:4px}.stat span{color:var(--muted);font-size:13px}.primary{background:var(--green);color:white}.taskform{display:flex;gap:8px;margin-bottom:12px}input,select{min-width:0;padding:11px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:#fff}#taskText{flex:1;width:100%}.filters{display:flex;gap:6px;margin:20px 0}.filters button{font-size:13px;padding:8px 13px}.filters .active{background:var(--ink);color:white}.task{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #edf0e9}.task input{width:20px;height:20px;accent-color:var(--green);flex-shrink:0}.task label{flex:1;overflow-wrap:anywhere;line-height:1.6}.task.done label{text-decoration:line-through;color:var(--muted)}.delete{background:transparent;color:#92726b;font-size:13px;padding:8px}.empty{text-align:center;color:var(--muted);padding:34px 0;line-height:1.8}.progress{height:7px;border-radius:8px;background:#eaf0e6;overflow:hidden;margin-top:20px}.progress div{height:100%;background:#76a86c;transition:width .3s}.timer{background:#e9efdf;position:relative;text-align:center;display:flex;flex-direction:column;align-items:center}.timer .cardhead{width:100%}.modebuttons{display:flex;gap:8px}.modebuttons button{background:transparent;padding:9px 18px;font-size:14px}.modebuttons button.active{background:white;box-shadow:0 2px 10px #213c3510}.clock{margin:25px 0 18px;width:230px;height:230px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:7px solid #d4dfc7;background:#f5f7ed;box-shadow:0 0 0 11px #ffffff45;font-size:54px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-2px}.timer p{font-size:14px;color:var(--muted)}.timeractions{display:flex;gap:10px;margin-top:10px}.timeractions .primary{min-width:150px}.settings{display:flex;align-items:center;gap:8px;margin-top:22px;font-size:13px}.settings input{width:68px;background:#ffffff90}.tip{margin-top:24px;padding:20px 24px;border:1px dashed #c8d3bc;border-radius:16px;line-height:1.8;font-size:14px}.tip b{color:var(--green)}footer{display:flex;justify-content:space-between;margin-top:26px;gap:12px;color:var(--muted);font-size:12px;line-height:1.7}#notice{min-height:22px;color:#866127;font-size:13px}#timerStatus{min-height:22px}@media(max-width:760px){.layout{grid-template-columns:1fr}main{padding:28px 16px}header{padding:22px 16px}.tag{display:none}.card{padding:22px}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}footer{flex-direction:column}.taskform button{padding:10px 12px}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">f.</span>Focus Room</div><div class="tag">ONE TASK AT A TIME</div></header>
<main>
<div class="eyebrow">YOUR LITTLE STUDY SPACE</div><h1>今天，也向目標靠近一點。</h1><p class="intro">把大目標拆成小任務，留一段時間給專心的自己。</p>
<section class="stats" aria-label="學習統計"><div class="stat"><strong id="total">0</strong><span>讀書任務</span></div><div class="stat"><strong id="completed">0</strong><span>已完成任務</span></div><div class="stat"><strong id="sessions">0</strong><span>累計專注回合</span></div></section>
<div class="layout">
<section class="card"><div class="cardhead"><h2>我的讀書清單</h2><span class="sub" id="percent">完成 0%</span></div>
<form id="taskForm" class="taskform"><input id="taskText" aria-label="新增讀書任務" placeholder="例如：完成微分方程練習 3 題" maxlength="100" required><button class="primary" type="submit">＋ 新增</button></form>
<div id="notice" role="status"></div><div class="filters" aria-label="任務篩選"><button type="button" data-filter="all" class="active" aria-pressed="true">全部</button><button type="button" data-filter="pending" aria-pressed="false">待完成</button><button type="button" data-filter="done" aria-pressed="false">已完成</button></div>
<div id="taskList"></div><div class="progress" role="progressbar" aria-label="任務完成率" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progressFill"></div></div>
</section>
<section class="card timer"><div class="cardhead"><h2>留一段專注時間</h2><span class="sub">POMODORO</span></div><div class="modebuttons"><button type="button" id="focusMode" class="active" aria-pressed="true">專注</button><button type="button" id="restMode" aria-pressed="false">短休息</button></div><div class="clock" id="clock" role="timer" aria-label="剩餘時間">25:00</div><p id="timerStatus" role="status">選一個任務，準備開始吧。</p><div class="timeractions"><button class="primary" id="toggleTimer" type="button">開始專注</button><button id="resetTimer" type="button">重設</button></div><label class="settings">本回合長度 <input id="duration" type="number" min="1" max="120" value="25"> 分鐘 <button type="button" id="applyDuration">套用</button></label><p class="sub">專注結束後，記得給自己 5 分鐘休息。</p></section>
</div>
<div class="tip"><b>今天的小提醒</b>　不用一次做完所有事。先完成清單裡最小的一件，就是很好的開始。</div>
<footer><span>Focus Room · 我的讀書小基地</span><span>紀錄保存在此瀏覽器；清除網站資料會移除紀錄。</span></footer>
</main>
<script>
'use strict';
const KEY='focus-room-v1';
let tasks=[],sessions=0,filter='all',mode='focus',minutes={focus:25,rest:5},remaining=1500,running=false,endAt=0,ticker=null;
const $=id=>document.getElementById(id);
try{const saved=JSON.parse(localStorage.getItem(KEY));if(saved&&typeof saved==='object'){if(Array.isArray(saved.tasks))tasks=saved.tasks.filter(t=>t&&typeof t.id==='string'&&typeof t.text==='string'&&typeof t.done==='boolean').slice(0,300);if(Number.isSafeInteger(saved.sessions)&&saved.sessions>=0)sessions=saved.sessions;}}catch(e){$('notice').textContent='無法讀取舊紀錄，仍可使用本頁功能。';}
function save(){try{localStorage.setItem(KEY,JSON.stringify({tasks,sessions}));}catch(e){$('notice').textContent='瀏覽器無法儲存，目前紀錄僅保留至關閉頁面。';}}
function render(){
 const done=tasks.filter(t=>t.done).length,percent=tasks.length?Math.round(done/tasks.length*100):0;
 $('total').textContent=tasks.length;$('completed').textContent=done;$('sessions').textContent=sessions;$('percent').textContent='完成 '+percent+'%';$('progressFill').style.width=percent+'%';document.querySelector('[role="progressbar"]').setAttribute('aria-valuenow',percent);
 const list=$('taskList');list.replaceChildren();const visible=tasks.filter(t=>filter==='all'||(filter==='done'?t.done:!t.done));
 if(!visible.length){const p=document.createElement('p');p.className='empty';p.textContent=tasks.length?'這個分類目前沒有任務。':'清單還是空的。\n新增第一個小目標吧！';list.append(p);}
 visible.forEach(t=>{const row=document.createElement('div');row.className='task'+(t.done?' done':'');const check=document.createElement('input');check.type='checkbox';check.checked=t.done;check.id='task-'+t.id;check.addEventListener('change',()=>{t.done=check.checked;save();render();});const label=document.createElement('label');label.htmlFor=check.id;label.textContent=t.text;const del=document.createElement('button');del.type='button';del.className='delete';del.textContent='刪除';del.setAttribute('aria-label','刪除 '+t.text);del.addEventListener('click',()=>{tasks=tasks.filter(x=>x.id!==t.id);save();render();});row.append(check,label,del);list.append(row);});
}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const text=$('taskText').value.trim();if(!text){$('notice').textContent='請輸入任務內容。';return;}if(tasks.length>=300){$('notice').textContent='任務已達 300 筆，請先刪除舊任務。';return;}tasks.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2),text,done:false});$('notice').textContent='任務已新增。';$('taskText').value='';filter='all';updateFilters();save();render();$('taskText').focus();});
function updateFilters(){document.querySelectorAll('[data-filter]').forEach(b=>{const active=b.dataset.filter===filter;b.classList.toggle('active',active);b.setAttribute('aria-pressed',active);});}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;updateFilters();render();}));
function displayTime(){$('clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');document.title=(running?$('clock').textContent+' · ':'')+'Focus Room｜我的讀書小基地';}
function stop(){running=false;clearInterval(ticker);ticker=null;}
function sync(){if(!running)return;remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));displayTime();if(remaining===0){stop();if(mode==='focus'){sessions++;save();render();$('timerStatus').textContent='完成一回合！切換短休息，放鬆一下。';}else{$('timerStatus').textContent='休息結束！準備開始下一回合。';}$('toggleTimer').textContent='再來一回合';}}
$('toggleTimer').addEventListener('click',()=>{if(running){sync();if(!running)return;stop();$('toggleTimer').textContent='繼續';$('timerStatus').textContent='已暫停，準備好再繼續。';}else{if(remaining===0)remaining=minutes[mode]*60;endAt=Date.now()+remaining*1000;running=true;$('toggleTimer').textContent='暫停';$('timerStatus').textContent=mode==='focus'?'專注中，一次只做一件事。':'休息中，讓眼睛離開螢幕。';ticker=setInterval(sync,250);displayTime();}});
function reset(){stop();remaining=minutes[mode]*60;displayTime();$('toggleTimer').textContent=mode==='focus'?'開始專注':'開始休息';$('timerStatus').textContent=mode==='focus'?'選一個任務，準備開始吧。':'深呼吸，喝一口水。';}
$('resetTimer').addEventListener('click',reset);
function switchMode(next){mode=next;['focus','rest'].forEach(m=>{const b=$(m+'Mode');b.classList.toggle('active',m===mode);b.setAttribute('aria-pressed',m===mode);});$('duration').value=minutes[mode];reset();}
$('focusMode').addEventListener('click',()=>switchMode('focus'));$('restMode').addEventListener('click',()=>switchMode('rest'));
$('applyDuration').addEventListener('click',()=>{const v=Number($('duration').value);if(!Number.isInteger(v)||v<1||v>120){$('timerStatus').textContent='請輸入 1 到 120 的整數分鐘。';return;}minutes[mode]=v;reset();$('timerStatus').textContent='已套用 '+v+' 分鐘，計時已重設。';});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync();});render();displayTime();
</script>
</body></html>
